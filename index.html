"},{"id":125,"type":"mcq","question":"Cauza principală a anginei pectorale în 90% din cazuri este:","options":[{"id":"a","text":"coronarita reumatismală"},{"id":"b","text":"ateroscleroza coronariană"},{"id":"c","text":"embolii congenitale"},{"id":"d","text":"anomalii congenitale ale arterelor coronare"}],"correct":"b"},{"id":126,"type":"mcq","question":"Sunt cauze determinante ale angorului pectoral, cu excepţia:","options":[{"id":"a","text":"ateroscleroza coronariană"},{"id":"b","text":"diabetul zaharat"},{"id":"c","text":"cardiopatii valvulare"},{"id":"d","text":"coronarita reumatismală"}],"correct":"b"},{"id":127,"type":"mcq","question":"Durerea anginoasă este expresia ischemiei miocardice care apare datorită:","options":[{"id":"a","text":"modificărilor anatomice sau funcționale ale circulației pulmonare"},{"id":"b","text":"dezechilibrului între aportul şi necesarul de oxigen la nivel miocardic;"},{"id":"c","text":"anomaliilor congenitale cerebrale;"},{"id":"d","text":"toate de mai sus;"}],"correct":"b"},{"id":128,"type":"mcq","question":"Sediul durerii în angina pectorală stabilă (de  efort) este  cel  mai  frecvent:","options":[{"id":"a","text":"epigastric"},{"id":"b","text":"retrosternal"},{"id":"c","text":"interscapular"},{"id":"d","text":"abdominal"}],"correct":"b"},{"id":129,"type":"mcq","question":"Durerea toracică apărută la efort care cedează la nitroglicerină este caracteristică pentru:","options":[{"id":"a","text":"infarctul miocardic"},{"id":"b","text":"pericardita constrictivă"},{"id":"c","text":"angina pectorală"},{"id":"d","text":"endocardită bacteriană"}],"correct":"c"},{"id":130,"type":"mcq","question":"Durerea coronariană ce survine la efort, emoţii, frig, are o durată de 2- 3 min. şi cedează la nitroglicerină este caracteristică pentru:","options":[{"id":"a","text":"angina pectorală"},{"id":"b","text":"infarct miocardic acut"},{"id":"c","text":"stenoză mitrală"},{"id":"d","text":"nici un raspuns corect"}],"correct":"a"},{"id":131,"type":"mcq"," "id":"d","text":"Gama-GT"}],"correct":"d"},{"id":143,"type":"mcq","question":"Cele mai importante semne de laborator în IMA sunt:","options":[{"id":"a","text":"leucocitoza cu neutrofilie"},{"id":"b","text":"creşterea fibrinogenului plasmatic"},{"id":"c","text":"creşterea TGO, CK, CK-MB și LDH după 4-6 ore de la debut"},{"id":"d","text":"creșterea glucozei serice"}],"correct":"c"},{"id":144,"type":"mcq","question":"Conduita de urgenţă în IMA urmărește:","options":[{"id":"a","text":"prevenirea morţii subite şi preîntâmpinarea complicaţiilor"},{"id":"b","text":"evitarea repausului prelungit la pat"},{"id":"c","text":"mobilizarea cât mai precoce"},{"id":"d","text":"instituirea regimului igieno-dietetic"}],"correct":"a"},{"id":145,"type":"mcq","question":"Obiectivele imediate în îngrijirea pacientului cu IMA sunt:","options":[{"id":"a","text":"ameliorarea durerii și anxietății, oxigenoterapia și administrarea de anticoagulante;"},{"id":"b","text":"administrarea nitroglicerinei sublingual și repaus relativ la pat;"},{"id":"c","text":"recuperarea și reintegrarea sociala a pacientului;"},{"id":"d","text":"asigurarea regimului hiposodat, hipolipidic, hipoglucidic și normoprotidic;"}],"correct":"a"},{"id":146,"type":"mcq","question":"Tratamentul de elecție în IMA constă în administrarea de:","options":[{"id":"a","text":"sedative și diuretice"},{"id":"b","text":"nitroglicerină sublingual"},{"id":"c","text":"trombolitice și vasodilatatoare coronariene"},{"id":"d","text":"hipotensoare și antalgice"}],"correct":"c"},{"id":147,"type":"mcq","question":"Restabilirea fluxului coronarian şi reperfuzia tisulară miocardică, baza tratamentului la pacienţi cu IMA, au următoarele scopuri:","options":[{"id":"a","text":"reducerea dimensiunii infarctului"},{"id":"b","text":"păstrarea funcţiei ventricului stâng"},{"id":"c","text":"scăderea mortalităţii şi morbidităţii"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":148,"type":"mcq","question":"Tratamentul de reperfuzie în IMA se f ":"c","text":"infecţii intestinale;"},{"id":"d","text":"factori genetici;"}],"correct":"c"},{"id":188,"type":"mcq","question":"Dintre factorii determinanți ai bronşitei cronice un loc primordial îl ocupă:","options":[{"id":"a","text":"infecţia"},{"id":"b","text":"alergia"},{"id":"c","text":"factori iritanţi"},{"id":"d","text":"factorii de mediu"}],"correct":"a"},{"id":189,"type":"mcq","question":"Bronşita cronică este un sindrom clinic caracterizat prin:","options":[{"id":"a","text":"tuse insoţită de secreţii bronşice, permanentă sau intermitentă"},{"id":"b","text":"tuse însoţită de creşterea secreţiilor bronşice cauzată de o leziune bronhopulmonară specifică"},{"id":"c","text":"tuse însoţită de secreţii bronşice mai mult de 3 luni pe an, timp de 1-2 ani"},{"id":"d","text":"distrugerea treptată a pereților alveolelor"}],"correct":"a"},{"id":190,"type":"mcq","question":"Cele mai obişnuite alergene care pot declanșa o criză de astm bronșic sunt:","options":[{"id":"a","text":"alergene din mediu: polen, praf de cameră, păr de animale, fungii atmosferici, acarieni;"},{"id":"b","text":"alergene alimentare: lapte, ouă, carne;"},{"id":"c","text":"alergene medicamentoase: acidul acetilsalicilic, penicilina, aminofenazona;"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":191,"type":"mcq","question":"Din punct de vedere clinic astmul bronşic se manifestă prin:","options":[{"id":"a","text":"febră, transpirații nocturne, junghi toracic"},{"id":"b","text":"accese de dispnee, tuse, wheezing"},{"id":"c","text":"ortopnee, acrocianoză, tahipnee"},{"id":"d","text":"dispnee, ascită, hepato și splenomegalie"}],"correct":"b"},{"id":192,"type":"mcq","question":"Dispneea paroxistică din astmul bronșic este consecinţa a 3 factori ce induc bronhospasmul:","options":[{"id":"a","text":"hipersecreția bronșică"},{"id":"b","text":"edemul mucoasei bronșice"},{"id":"c","text":"contracția musculaturii bronhiilor"},{"id":"d","text":"toți factorii de mai sus"}],"correct":"d"},{"id":193,"ty ețeli, greață, vărsături"},{"id":"c","text":"durere precordială, tuse seacă, febră, dispnee expiratorie"},{"id":"d","text":"durere toracică, cefalee, vărsături"}],"correct":"a"},{"id":199,"type":"mcq","question":"Edemul pulmonar acut cardiogen este cauzat de:","options":[{"id":"a","text":"leziuni inflamatorii"},{"id":"b","text":"leziuni pulmonare directe"},{"id":"c","text":"IMA/ ischemia miocardică"},{"id":"d","text":"intoxicaţii cu substanțe toxice"}],"correct":"c"},{"id":200,"type":"mcq","question":"Cauzele edemului pulmonar acut lezional sunt următoarele, cu excepția:","options":[{"id":"a","text":"cauze cardiace"},{"id":"b","text":"cauze neurologice"},{"id":"c","text":"cauze toxice"},{"id":"d","text":"cauze infecțioase"}],"correct":"a"},{"id":201,"type":"mcq","question":"Tusea cu expectorație spumoasă, rozată și aerată  se întâlnește în:","options":[{"id":"a","text":"criza de astm bronșic"},{"id":"b","text":"TBC pulmonară"},{"id":"c","text":"abces pulmonar"},{"id":"d","text":"EPA"}],"correct":"d"},{"id":202,"type":"mcq","question":"Manifestarile clinice în edemul pulmonar acut sunt:","options":[{"id":"a","text":"dispnee intensă severă, ortopnee, tahipnee"},{"id":"b","text":"dispnee cu caracter expirator prelungit"},{"id":"c","text":"bradipnee cu expirație forțată, șuierătoare"},{"id":"d","text":"durere constrictivă sub formă de junghi toracic"}],"correct":"a"},{"id":203,"type":"mcq","question":"Conduita de urgență în EPA constă în:","options":[{"id":"a","text":"poziție șezând, aspirarea secrețiilor, curățarea orofaringelui, oxigenoterapie"},{"id":"b","text":"tratament cu diuretice indiferent de valoarea TA"},{"id":"c","text":"tratament cu anticoagulante"},{"id":"d","text":"repaus la pat în DD și regim alimentar hiposodat"}],"correct":"a"},{"id":204,"type":"mcq","question":"În toate cazurile de EPA cu TA scăzută sunt contraindicate:","options":[{"id":"a","text":"administrarea de oxigen pe sondă nazo-faringiană, umidificat"},{"id":"b","text":"așezarea pacientului î ort"}],"correct":"c"},{"id":211,"type":"mcq","question":"Un bolnav cu tromboflebită la gambe care acuză dispnee, tahicardie și junghi toracic are cu mare probabilitate diagnosticul de:","options":[{"id":"a","text":"infarct miocardic acut"},{"id":"b","text":"pneumonie bacteriană"},{"id":"c","text":"embolie pulmonară"},{"id":"d","text":"criză de astm bronșic"}],"correct":"c"},{"id":212,"type":"mcq","question":"Factorii de risc în embolia pulmonară sunt:","options":[{"id":"a","text":"tromboza venoasă profundă a gambei"},{"id":"b","text":"insuficiența renală acută"},{"id":"c","text":"infecții hepatobiliare"},{"id":"d","text":"trombocitopenia"}],"correct":"a"},{"id":213,"type":"mcq","question":"Care dintre următoarele nu constituie un obiectiv terapeutic în embolia pulmonară:","options":[{"id":"a","text":"susţinerea funcţiilor vitale"},{"id":"b","text":"administrare de hemostatice"},{"id":"c","text":"limitarea extinderii trombozei"},{"id":"d","text":"calmarea durerii"}],"correct":"b"},{"id":214,"type":"mcq","question":"Care este medicația utilă în embolia pulmonară?","options":[{"id":"a","text":"bronhodilatatoare (salbutamolul)"},{"id":"b","text":"betablocante (metoprololul)"},{"id":"c","text":"anticoagulante (heparina)"},{"id":"d","text":"antibiotice"}],"correct":"c"},{"id":215,"type":"mcq","question":"Semnele care apar în pneumotorax spontan sunt:","options":[{"id":"a","text":"spută cu sânge, stare de șoc, TA prăbușită"},{"id":"b","text":"durere toracică surdă, dispnee moderată"},{"id":"c","text":"junghi toracic violent, dispnee, cianoză, tuse chintoasă"},{"id":"d","text":"grețuri, vărsături, paloare, stare de șoc"}],"correct":"c"},{"id":216,"type":"mcq","question":"În  insuficiența  respiratorie  acută  prima  măsură  de urgență este:","options":[{"id":"a","text":"administrarea de oxigen"},{"id":"b","text":"administrarea de antibiotice"},{"id":"c","text":"administrarea de expectorante"},{"id":"d","text":"administrarea de antitermice"}],"correct":"a"},{"id":217,"type": lent cu dispnee dureroasă"},{"id":"b","text":"urticarie, prurit, tuse iritativă, uscată, dispnee"},{"id":"c","text":"cianoză, dispnee cu polipnee, tuse"},{"id":"d","text":"dispnee inspiratorie cu bradipnee"}],"correct":"b"},{"id":223,"type":"mcq","question":"Care din următoarele afirmații privind tuberculoza este falsă:","options":[{"id":"a","text":"tuberculoza este o boală contagioasă;"},{"id":"b","text":"tuberculoza este determinată de bacilul Mycobacterium tuberculosis;"},{"id":"c","text":"tuberculoza se transmite pe cale aeriană, de la om la om;"},{"id":"d","text":"localizarea pulmonară nu este predominantă;"}],"correct":"d"},{"id":224,"type":"mcq","question":"Diagnosticul de certitudine în TBC pulmonar se pune pe:","options":[{"id":"a","text":"I.D.R. la tuberculină"},{"id":"b","text":"examenul bacteriologic al sputei"},{"id":"c","text":"măsurarea  presiunii gazelor arteriale"},{"id":"d","text":"radioscopia pulmonară"}],"correct":"b"},{"id":225,"type":"mcq","question":"Care dintre următoarele afirmaţii este adevărată cu privire la prelevarea sputei:","options":[{"id":"a","text":"pacientul expectorează într-un recipient steril în salon;"},{"id":"b","text":"pacientul expectorează dimineaţa într-un recipient steril cu capac, într-o cameră special amenajată, după ce a fost instruit;"},{"id":"c","text":"nu este necesară pregătire prealabilă deoarece toţi pacienţii respiratori tuşesc;"},{"id":"d","text":"nu sunt necesare măsuri de protecţie a mediului ambiant pentru că pacienţii respiratori sunt izolaţi."}],"correct":"b"},{"id":226,"type":"mcq","question":"Alegeți afirmația adevărată:","options":[{"id":"a","text":"tratamentul împotriva tuberculozei pulmonare se face cu isoniazidă, rifampicină, pirazinamidă, etambutol, streptomicină;"},{"id":"b","text":"tratamentul împotriva tuberculozei pulmonare se face cu antibiotice din grupa peniciline;"},{"id":"c","text":"tratamentul împotriva tuberculozei pulmonare se face cu antibiotice cu spectru larg conform antibiogramei;"}, orect"}],"correct":"c"},{"id":441,"type":"mcq","question":"Toxiinfecţiile alimentare sunt cauzate de:","options":[{"id":"a","text":"virusuri cu transmitere respiratorie"},{"id":"b","text":"consumul de alimente contaminate cu microorganisme patogene"},{"id":"c","text":"contactul cu obiecte de toaletă contaminate"},{"id":"d","text":"transfuzii de sânge incompatibil"}],"correct":"b"},{"id":442,"type":"mcq","question":"Diareea acută infecțioasă poate fi cauzată de:","options":[{"id":"a","text":"virusuri"},{"id":"b","text":"bacterii"},{"id":"c","text":"paraziți"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":443,"type":"mcq","question":"Îngrijirea bolnavului cu HVA are următoarele obiective:","options":[{"id":"a","text":"monitorizarea funcţiilor vitale"},{"id":"b","text":"regim dietetic hepatoprotector"},{"id":"c","text":"izolarea bolnavului în spital cel puţin 2 săptămâni de la debutul bolii"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":444,"type":"mcq","question":"Calea de transmitere a HVB este:","options":[{"id":"a","text":"aerogenă"},{"id":"b","text":"digestivă"},{"id":"c","text":"cutanată"},{"id":"d","text":"parenterală"}],"correct":"d"},{"id":445,"type":"mcq","question":"Cele mai frecvente modalități de transmitere a VHB sunt următoarele:","options":[{"id":"a","text":"transmitere perinatala, de la mamă la făt"},{"id":"b","text":"transfuzii de sânge"},{"id":"c","text":"instrumentar nesterilizat"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":446,"type":"mcq","question":"Imunoprofilaxia infecţiei VHB se poate face activ prin:","options":[{"id":"a","text":"vaccinare"},{"id":"b","text":"administrare de imunoglobulină specifică"},{"id":"c","text":"vitaminoterapie"},{"id":"d","text":"aeroclimatoterapie"}],"correct":"a"},{"id":447,"type":"mcq","question":"În sindroamele febrile care evoluează cu temperaturi peste 38o C se administrează:","options":[{"id":"a","text":"antipiretice"},{"id":"b","text":"antiinflamatoare"},{"id":"c","text":"comprese umede și reci pe tegumente / împachetări reci"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":448,"type":"mcq","question":"Pacienţii infectaţi cu virus HIV au următoarele posibilităţi de evoluţie:","options":[{"id":"a","text":"1/3 dintre ei vor face forma minoră a bolii"},{"id":"b","text":"1/3 dintre ei vor face SIDA – forma gravă a infecţiei HIV"},{"id":"c","text":"1/3 dintre ei rămân purtători sănătoşi de virus HIV şi pot transmite infecţia"},{"id":"d","text":"toate posibilitățile sunt adevărate"}],"correct":"d"},{"id":449,"type":"mcq","question":"Metodele de transmitere indirectă a unui agent infecțios sunt:","options":[{"id":"a","text":"alimente contaminate"},{"id":"b","text":"vectori (animale, insecte)"},{"id":"c","text":"parenteral (injectii cu seringi contaminate)"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":450,"type":"mcq","question":"Meningitele acute pot avea următoarele etiologii:","options":[{"id":"a","text":"virală"},{"id":"b","text":"bacteriană"},{"id":"c","text":"fungică"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":451,"type":"mcq","question":"Investigația de laborator cu valoare de diagnostic într-o suspiciune de meningită este:","options":[{"id":"a","text":"hemoleucograma"},{"id":"b","text":"exudatul faringian"},{"id":"c","text":"examenul lichidului cefalorahidian (LCR)"},{"id":"d","text":"viteza de sedimentare a hematiilor (VSH)"}],"correct":"c"},{"id":452,"type":"mcq","question":"Antibioticele utilizate frecvent în dermatologie în tratamentele locale sunt:","options":[{"id":"a","text":"kanamicina (unguent cu kanamicină)"},{"id":"b","text":"eritromicina (unguent cu eritromicină)"},{"id":"c","text":"neomicina şi bacitracina (unguent şi pudră Baneocin)"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":453,"type":"mcq","question":"Fac parte din categoria leziunilor cu conținut lichid:","options":[{"id":"a","text":"vezicula, papula, macula"},{"id":"b","text":"flictena, excoriația, r oragia și infecțiile"},{"id":"d","text":"scurgeri vaginale mucoase"}],"correct":"c"},{"id":580,"type":"mcq","question":"Avortul în curs de efectuare se recunoaște după următoarele manifestări clinice:","options":[{"id":"a","text":"leucoree abundentă cu miros fetid"},{"id":"b","text":"hemoragie importantă, contracții uterine de intensitate crescândă, col deschis"},{"id":"c","text":"ușoare dureri pelviabdominale și mici pierderi de sânge pe cale vaginală"},{"id":"d","text":"dureri abdominale și lombare, consistență moale a uterului, col închis"}],"correct":"b"},{"id":581,"type":"mcq","question":"Sarcina ectopică poate avea următoarele localizări:","options":[{"id":"a","text":"tubară"},{"id":"b","text":"abdominală"},{"id":"c","text":"cervicală"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":582,"type":"mcq","question":"Cauzele sarcinii extrauterine pot fi:","options":[{"id":"a","text":"ovulare"},{"id":"b","text":"tubare"},{"id":"c","text":"hormonale"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":583,"type":"mcq","question":"Sub numele de fibrom uterin se înțelege:","options":[{"id":"a","text":"o formațiune care se dezvoltă înainte de pubertate"},{"id":"b","text":"tumoarea uterului care se dezvoltă independent de funcția ovariană"},{"id":"c","text":"o afecțiune inflamatorie la nivelul mucoasei uterine"},{"id":"d","text":"tumoarea uterului care se dezvolta prin proliferarea miometrului"}],"correct":"d"},{"id":584,"type":"mcq","question":"Cel mai frecvent simptom în fibromul uterin este:","options":[{"id":"a","text":"scurgeri genitale abundente"},{"id":"b","text":"hemoragia uterină"},{"id":"c","text":"stare de oboseală excesivă"},{"id":"d","text":"HTA și edeme"}],"correct":"b"},{"id":585,"type":"mcq","question":"Hemoragia din fibromul uterin se manifestă sub formă de:","options":[{"id":"a","text":"metroragii"},{"id":"b","text":"menoragii - menstruatii abundente și prelungite"},{"id":"c","text":"hipomenoree"},{"id":"d","text":"oligomenoree"}],"co rtonia globilor oculari"},{"id":"c","text":"polipnee cu halenă acetonică"},{"id":"d","text":"semne de deshidratare globală"}],"correct":"a"},{"id":677,"type":"mcq","question":"Manifestările clinice obiective în meningita acută sunt:","options":[{"id":"a","text":"stare confuzională, febră"},{"id":"b","text":"cefalee, redoarea cefei"},{"id":"c","text":"fotofobie, vărsături în jet"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":678,"type":"mcq","question":"Evaluarea alterării nivelului de conştientă la comatoși se realizează prin:","options":[{"id":"a","text":"determinarea reacţiei pacientului la stimuli"},{"id":"b","text":"descrierea comportamentului în momentul reacţiei"},{"id":"c","text":"descrierea răspunsului verbal şi motor al pacientului"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":679,"type":"mcq","question":"Coma profundă se caracterizează prin:","options":[{"id":"a","text":"stare de veghe încă prezentă, dar cu un grad de somnolență"},{"id":"b","text":"bolnavul nu reacționează la excitanți dureroși dar are păstrate reflexele"},{"id":"c","text":"tulburari respiratorii și circulatorii, reflexe abolite"},{"id":"d","text":"funcțiile vitale sunt menținute artificial"}],"correct":"c"},{"id":680,"type":"mcq","question":"Ce tip de comă se caracterizează prin abolirea reflexelor osteotendinoase, pupilare și de deglutiție:","options":[{"id":"a","text":"coma vigilă, grad I"},{"id":"b","text":"coma profundă, grad III"},{"id":"c","text":"coma propriu-zisă, grad II"},{"id":"d","text":"coma ireversibilă, grad IV"}],"correct":"b"},{"id":681,"type":"mcq","question":"Pacientul inconștient comatos poate fi transportat în poziție:","options":[{"id":"a","text":"decubit dorsal fără pernă"},{"id":"b","text":"decubit lateral sau semiventral"},{"id":"c","text":"trendelenburg"},{"id":"d","text":"decubit dorsal cu pernă"}],"correct":"b"},{"id":682,"type":"mcq","question":"La ce valoare a alcoolemiei se instalează coma la alcoolici:","options":[{"id":"a","tex ură mână."},{"id":"c","text":"Simptomele bolii sunt ușoare și nu afectează calitatea vieții pacientului."},{"id":"d","text":"Deși boala nu poate fi vindecată, medicamentele pot îmbunătăți semnificativ simptomele."}],"correct":"c"},{"id":688,"type":"mcq","question":"Factorii de risc cu rol-cheie în apariția și progresia bolii Parkinson sunt:","options":[{"id":"a","text":"vârsta, sexul"},{"id":"b","text":"factorii de mediu"},{"id":"c","text":"factorii genetici"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":689,"type":"mcq","question":"Pacientul cu boala Parkinson prezintă:","options":[{"id":"a","text":"mers suplu cu paşi mari"},{"id":"b","text":"mers fără supleţe, cu paşi mici"},{"id":"c","text":"mers cu trunchiul înclinat pe spate"},{"id":"d","text":"relaxare musculară generalizată"}],"correct":"b"},{"id":690,"type":"mcq","question":"Medicamentul cel mai eficient folosit în tratarea simptomelor bolii Parkinson este:","options":[{"id":"a","text":"Fenobarbital"},{"id":"b","text":"Fenitoin"},{"id":"c","text":"Diazepam"},{"id":"d","text":"Levodopa"}],"correct":"d"},{"id":691,"type":"mcq","question":"Măsurile de prevenție a bolii Parkinson sunt:","options":[{"id":"a","text":"exerciții fizice realizate în mod constant"},{"id":"b","text":"alimentație sănătoasă bogată în fibre, proteine, minerale și vitamine"},{"id":"c","text":"odihnă adecvată"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":692,"type":"mcq","question":"Psihiatria este o ramură a stiințelor medicale care se ocupă de:","options":[{"id":"a","text":"cunoașterea și tratarea bolilor psihice"},{"id":"b","text":"reinserția socială a  pacienților cu maladii mintale"},{"id":"c","text":"redarea caliății vieții pacienților cu maladii mintale"},{"id":"d","text":"toate de mai sus"}],"correct":"d"},{"id":693,"type":"mcq","question":"Tulburări de memorie sunt:","options":[{"id":"a","text":"hiperestezie, hipoestezie, anestezie"},{"id":"b","text":"hipomnezie, hipermnezie, amnezie"},{"id":"c","text": let pool=[],index=0,score=0,answered=false,mode='',exam=false,examAnswers=[],examTimer=null,examEnd=0;
let stats=JSON.parse(localStorage.getItem('amgQuizStats')||'{"answered":0,"correct":0,"wrong":[]}');
let examHistory=JSON.parse(localStorage.getItem('amgExamHistory')||'[]');
function saveStats(){localStorage.setItem('amgQuizStats',JSON.stringify(stats));loadStats()}
function loadStats(){statAnswered.textContent=stats.answered;statCorrect.textContent=stats.correct;statWrong.textContent=stats.wrong.length;counts.textContent=`${data.mcq.length} grile • ${data.tf.length} A/F • ${data.assoc.length} asocieri`;renderExamHistory()}
function clearWrong(){if(confirm('Ștergi toate întrebările greșite?')){stats.wrong=[];saveStats()}}
function clearProgress(){if(confirm('Ștergi tot progresul: rezolvate, corecte și greșeli?')){stats={answered:0,correct:0,wrong:[]};localStorage.removeItem('amgQuizStats');loadStats()}}
function renderExamHistory(){let box=document.getElementById('examHistory');if(!examHistory.length){box.innerHTML='<h3>Examene finalizate</h3><p class="small">Nu ai finalizat încă niciun examen.</p>';return}box.innerHTML='<h3>Examene finalizate</h3>'+examHistory.map((e,i)=>'<div class="assocrow"><b>Examen '+(i+1)+'</b><br><span class="small">'+e.date+'</span><br>Scor: <b>'+e.score+'/'+e.total+'</b></div>').join('')}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function showApp(){start.hidden=true;app.hidden=false}
function startQuiz(kind){exam=false;stopTimer();mode=kind;pool=kind==='mcq'?[...data.mcq]:kind==='tf'?[...data.tf]:kind==='wrong'?[...data.mcq,...data.tf].filter(q=>stats.wrong.includes(q.type+':'+q.id)):shuffle([...data.mcq,...data.tf]);if(!pool.length){alert('Nu există întrebări în această categorie.');return}pool=shuffle(pool);index=0;score=0;showApp();render()}
function render(){answered=false;let q=pool[index];progress.textContent=`Întrebarea ${index+1} / ${pool.length}`;scoreEl();question.textContent=q.id+'. '+q.question;feedback.textContent='';options.innerHTML='';q.options.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o.id+') '+o.text;b.onclick=()=>answer(o.id,b);options.appendChild(b)});next.disabled=true;next.textContent=index===pool.length-1?'Finalizare':'Următoarea'}
function scoreEl(){score.textContent='Punctaj: '+score}
function answer(id,button){if(answered)return;answered=true;let q=pool[index];document.querySelectorAll('.option').forEach(b=>b.disabled=true);let ok=String(id).toLowerCase()===String(q.correct).toLowerCase();stats.answered++;if(ok){score++;stats.correct;button.classList.add('correct')}else{button.classList.add('wrong');let key=q.type+':'+q.id;if(!stats.wrong.includes(key))stats.wrong.push(key);document.querySelectorAll('.option').forEach(b=>{if(b.textContent.toLowerCase().startsWith(String(q.correct).toLowerCase()+')'))b.classList.add('correct')})}if(!exam){if(ok)stats.correct++;saveStats();feedback.textContent=ok?'Corect!':'Greșit. Răspuns corect: '+q.correct}else{examAnswers[index]={chosen:id,correct:q.correct,ok};feedback.textContent='Răspuns înregistrat.'}scoreEl();next.disabled=false}
function nextQuestion(){if(index===pool.length-1){if(exam){finishExam();return}alert(`Test finalizat! Scor: ${score}/${pool.length}`);backHome();return}index++;render()}
function backHome(){stopTimer();app.hidden=true;start.hidden=false;loadStats()}
function startAssociation(){exam=false;stopTimer();mode='assoc';pool=shuffle(data.assoc);index=0;score=0;showApp();renderAssoc()}
function renderAssoc(){let q=pool[index];progress.textContent=`Asociere ${index+1} / ${pool.length}`;score.textContent='';question.textContent='Exercițiul '+q.id;feedback.textContent='';options.innerHTML='';q.left.forEach(l=>{let row=document.createElement('div');row.className='assocrow';row.innerHTML='<b>'+l.id+'. '+l.text+'</b>';let s=document.createElement('select');s.dataset.left=l.id;s.innerHTML='<option value="">Alege răspunsul…</option>'+q.right.map(r=>`<option value="${r.id}">${r.id}) ${r.text}</option>`).join('');row.appendChild(s);options.appendChild(row)});let btn=document.createElement('button');btn.textContent='Verifică asocierile';btn.onclick=()=>gradeAssoc(q);options.appendChild(btn);next.disabled=true;next.textContent=index===pool.length-1?'Finalizare':'Următoarea'}
function gradeAssoc(q){let n=0;document.querySelectorAll('select').forEach(s=>{let expected=q.mappings.find(m=>String(m.left)===String(s.dataset.left));let ok=expected&&s.value===expected.right;if(ok){n++;s.classList.add('correct')}else{s.classList.add('wrong');s.title='Corect: '+(expected?expected.right:'-')}s.disabled=true});score=n;feedback.textContent=`Corecte: ${n}/${q.left.length}. Treci la următorul exercițiu.`;next.disabled=false}
function startExam(){stopTimer();exam=true;mode='exam';score=0;examAnswers=[];examAssocAnswers=[];let mcq=shuffle(data.mcq).slice(0,40),tf=shuffle(data.tf).slice(0,10),as=shuffle(data.assoc).slice(0,5);pool=[...mcq,...tf];examAssoc=as;examAssocIndex=0;examPart='questions';index=0;examEnd=Date.now()+7200000;showApp();renderExamQuestion();updateTimer();examTimer=setInterval(updateTimer,1000)}
let examAssoc=[],examAssocIndex=0,examPart='questions',examAssocAnswers=[];
function renderExamQuestion(){if(examPart==='assoc'){renderExamAssoc();return}let q=pool[index];answered=false;progress.textContent=`Examen: ${index+1} / 50`;score.textContent='';question.textContent=q.id+'. '+q.question;feedback.textContent='';options.innerHTML='';q.options.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o.id+') '+o.text;b.onclick=()=>examAnswer(o.id,b);options.appendChild(b)});next.disabled=true;next.textContent=index===pool.length-1?'Treci la asocieri':'Următoarea'}
function examAnswer(id,button){if(answered)return;answered=true;examAnswers[index]={chosen:id,correct:pool[index].correct,ok:String(id).toLowerCase()===String(pool[index].correct).toLowerCase()};document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('selected');feedback.textContent='Răspuns înregistrat.';next.disabled=false}
function renderExamAssoc(){let q=examAssoc[examAssocIndex];answered=false;progress.textContent=`Examen: asociere ${examAssocIndex+1} / 5`;question.textContent='Asociere '+q.id;feedback.textContent='';options.innerHTML='';q.left.forEach(l=>{let row=document.createElement('div');row.className='assocrow';row.innerHTML='<b>'+l.id+'. '+l.text+'</b>';let s=document.createElement('select');s.dataset.left=l.id;s.innerHTML='<option value="">Alege răspunsul…</option>'+q.right.map(r=>`<option value="${r.id}">${r.id}) ${r.text}</option>`).join('');row.appendChild(s);options.appendChild(row)});next.disabled=false;next.textContent=examAssocIndex===4?'Finalizează examenul':'Următoarea'}
function assocText(q,id){
  let item=q.right.find(r=>String(r.id)===String(id));
  return item ? String(id)+ ' - '+item.text : (id ? String(id) : 'necompletat');
}
function captureExamAssoc(){let q=examAssoc[examAssocIndex];let answers={};document.querySelectorAll('select').forEach(s=>answers[s.dataset.left]=s.value);examAssocAnswers[examAssocIndex]={q,answers}}
function nextExam(){if(examPart==='questions'){if(index<49){index++;renderExamQuestion()}else{examPart='assoc';renderExamAssoc()}}else{captureExamAssoc();if(examAssocIndex<4){examAssocIndex++;renderExamAssoc()}else finishExam()}}
function finishExam(){
  if(!exam)return;
  if(examPart==='assoc' && document.querySelectorAll('select').length)captureExamAssoc();
  stopTimer(); app.hidden=false; start.hidden=true;

  let wrong=[];
  let correctPoints=0;

  // Grile + A/F: one point for each fully correct answer.
  pool.forEach((q,i)=>{
    let a=examAnswers[i];
    if(a && a.ok){
      correctPoints++;
    }else{
      wrong.push({kind:'question',number:i+1,q:q,chosen:a?a.chosen:'necompletat',correct:q.correct});
    }
  });

  // Associations: one point ONLY when every mapping in the section is correct.
  examAssoc.forEach(q=>{
    let entry=examAssocAnswers.find(e=>e && String(e.q.id)===String(q.id));
    let answers=entry?entry.answers:{};
    let sectionCorrect=true;

    q.mappings.forEach(m=>{
      let chosen=answers[String(m.left)]||'';
      if(chosen!==m.right){
        sectionCorrect=false;
        wrong.push({
          kind:'assoc',number:q.id,q:q,left:m.left,
          chosen:chosen||'necompletat',correct:m.right
        });
      }
    });

    if(sectionCorrect)correctPoints++;
  });

  let totalExam=55;
  examHistory.unshift({
    date:new Date().toLocaleString('ro-RO'),
    score:correctPoints,
    total:totalExam
  });
  examHistory=examHistory.slice(0,50);
  localStorage.setItem('amgExamHistory',JSON.stringify(examHistory));

  let out='<h2>Rezultatul examenului</h2><p><b>Scor: '+correctPoints+'/'+totalExam+'</b></p>';
  out+='<p>Galben = răspunsul tău; verde = răspunsul corect. O secțiune de asociere valorează un punct numai dacă toate potrivirile sunt corecte.</p>';

  if(!wrong.length){
    out+='<div class="resultok">Felicitări! Nu ai răspunsuri greșite.</div>';
  }else{
    wrong.forEach(w=>{
      if(w.kind==='question'){
        out+='<div class="resultwrong"><h3>Întrebarea '+w.number+'</h3><div class="question">'+w.q.question+'</div>';
        w.q.options.forEach(o=>{
          let cls='';
          if(String(o.id).toLowerCase()===String(w.chosen).toLowerCase())cls='wrong';
          if(String(o.id).toLowerCase()===String(w.correct).toLowerCase())cls='correct';
          out+='<div class="option '+cls+'" style="cursor:default">'+o.id+') '+o.text+'</div>';
        });
        if(w.chosen==='necompletat')out+='<p class="small">Nu ai selectat niciun răspuns.</p>';
        out+='</div>';
      }else{
        out+='<div class="resultwrong"><h3>Asocierea '+w.q.id+'</h3>';
        let leftItem=w.q.left.find(x=>String(x.id)===String(w.left));
        out+='<div class="question">'+(leftItem?leftItem.text:'')+'</div>';
        out+='<div class="option wrong" style="cursor:default">Răspunsul tău: '+assocText(w.q,w.chosen)+'</div>';
        out+='<div class="option correct" style="cursor:default">Răspuns corect: '+assocText(w.q,w.correct)+'</div></div>';
      }
    });
  }
  out+='<button onclick="backHome()">Înapoi la meniu</button>';
  question.innerHTML=out; options.innerHTML=''; feedback.textContent='';
  progress.textContent='Examen finalizat'; score.textContent=''; next.disabled=true;
}
function updateTimer(){let left=Math.max(0,examEnd-Date.now());let sec=Math.floor(left/1000);timer.textContent=`Timp: ${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(left<=0)finishExam()}
function stopTimer(){if(examTimer){clearInterval(examTimer);examTimer=null}timer.textContent=''}
next.onclick=()=>{if(exam){if(examPart==='questions'||examPart==='assoc')nextExam();else nextQuestion()}else if(mode==='assoc'){if(index===pool.length-1){backHome()}else{index++;renderAssoc()}}else nextQuestion()}
loadStats();
</script></body></html>
